<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Cesar Steven Fermin Cabrera">
    <meta name="description" content="This page is about all the companies that are asociated with us">

    <meta property="og:title" content="ChambersDR">
    <meta property="og:description" content="This page is about all the companies that are asociated with us">
    <meta property="og:image" content="https://stevenfermin.github.io/wdd231/chamber/images/plane.png">
    <meta property="og:url" content="https://stevenfermin.github.io/wdd231/chamber/directory.html">

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/directorysmall.css">
    <link rel="stylesheet" href="styles/directorylarge.css">
    <script src="scripts/directory.js" defer></script>
    <link rel="shortcut icon" href="images/plane.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>ChambersDR Landing</title>
</head>
<body>
    <header>
        <nav class="navigation">
            <img src="images/plane.png" alt="Plane logo">
            <label>ChambersDR</label>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Discover</a></li>
                <li id="current"><a href="#">Busines Directory</a></li>
                <li><a href="#">Join</a></li>
            </ul>
            <button id="ham-btn" class="hamburger" aria-label="hambtn"></button>
        </nav>
        <nav id="mobileNav" class="mobileNav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Discover</a></li>
                <li id="mobilecurrent"><a href="#" >Busines Directory</a></li>
                <li><a href="#">Join</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/santodomingo.webp" alt="Santo Domingo">
            <div class="hero-content">
                <h1>ChambersDR | Chamber of commerce of the Dominican Republic!</h1>
                <button><a href="#">Join Here!</a></button>
            </div>
        </div>
        <section class="events">
            <figure>
                <img src="images/planting-trees.jpg" alt="Planting trees">
                <figcaption>Planting trees in the sidewalks of Piantini</figcaption>
                <a href="#">Join!</a>
            </figure>
            <figure>
                <img src="images/expo-tech.jpg" alt="Expo technology">
                <figcaption>Expo Techonology in Santiago</figcaption>
                <a href="#">Join!</a>
            </figure>
            <figure>
                <img src="images/hiking.jpg" alt="Hiking">
                <figcaption>Hiking of 7 days in the Pico Duarte Mountain</figcaption>
                <a href="#">Join!</a>
            </figure>
        </section>
        <div class="climate">
            <h2>WEATHER</h2>
            <section class="weather">
                <p id="temperature"></p>
                <figure>
                    <img id="weather-icon" src="" alt="">
                    <figcaption class="figcaption"></figcaption>
                </figure>
            </section>
            <section id="forecast" class="forecast">

            </section>
        </div>
        <div id="spotlights" class="spotlights">

        </div>
    </main>

    <footer>
        <div id="details">
            <p id="DName"></p>
            <p id="DAddress"></p>
            <p id="DEmail"></p>
            <p id="DNumber"></p>
        </div>
        <div class="logos">
            <a href="https://github.com/"><img src="images/github.png" alt="Github"></a>
            <a href="https://linkedin.com/"><img src="images/linkedin.png" alt="LinkedIn"></a>
            <a href="https://x.com/"><img src="images/xlogo.png" alt="Twitter X"></a>
        </div>
        <div class="mark">
            <p id="signature"></p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>
</html>
